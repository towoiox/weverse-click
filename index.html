<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>위버스 연습</title>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
text-align:center;
}

/* 네이비즘 잘라내기 */
#navy-wrap{
height:45vh;
overflow:hidden;
}

#navy{
width:100%;
height:600px;
border:none;
margin-top:-120px;
}

#main{
padding:15px;
}

#clock{
font-size:48px;
margin-bottom:20px;
font-weight:700;
color:#6ec6ff;
transition:color 0.15s linear;
}

.ms{
font-size:20px;
}

input{
padding:12px;
margin:5px;
width:80%;
max-width:320px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
}

button{
margin-top:15px;
padding:14px 35px;
background:#6ec6ff;
border:none;
border-radius:14px;
color:white;
font-size:18px;
font-weight:600;
}

#result{
margin-top:20px;
white-space:pre-line;
}
</style>

</head>

<body>

<div id="navy-wrap">
<iframe 
id="navy"
src="https://time.navyism.com/?host=weverse.io">
</iframe>
</div>

<div id="main">

<div id="clock"></div>

<input id="name" placeholder="신청자 이름"><br>
<input id="phone" placeholder="전화번호"><br>

<button onclick="submitForm()">제출!</button>

<div id="result"></div>

</div>

<script>

function updateClock(){
const now=new Date();

const sec=now.getSeconds();
const ms=now.getMilliseconds();

let intensity=0;

// 50초부터 진해짐
if(sec>=50){
intensity=(sec-50)/10+(ms/10000);
}

// 기본 색
const baseColor=[110,198,255];

// 점점 진해지는 색
const r=Math.floor(baseColor[0]*(1-intensity));
const g=Math.floor(baseColor[1]*(1-intensity));
const b=255;

const color="rgb("+r+","+g+","+b+")";

const time=
String(now.getHours()).padStart(2,"0")+":"+
String(now.getMinutes()).padStart(2,"0")+":"+
String(now.getSeconds()).padStart(2,"0");

const milli=
String(ms).padStart(3,"0");

document.getElementById("clock").style.color=color;

document.getElementById("clock").innerHTML=
time+".<span class='ms'>"+milli+"</span>";
}

setInterval(updateClock,30);

function submitForm(){

const name=document.getElementById("name").value;
const phone=document.getElementById("phone").value;

const now=new Date();

const time=
String(now.getHours()).padStart(2,"0")+":"+
String(now.getMinutes()).padStart(2,"0")+":"+
String(now.getSeconds()).padStart(2,"0")+"."+
String(now.getMilliseconds()).padStart(3,"0");

document.getElementById("result").innerText=
"이름 : "+name+"\n"+
"전화번호 : "+phone+"\n"+
"제출 시간 : "+time;

}

</script>

</body>
</html>
