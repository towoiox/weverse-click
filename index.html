<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>위버스 연습</title>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
text-align:center;
}

#navy-wrap{
height:170px;
overflow:hidden;
}

#navy{
width:100%;
height:600px;
border:none;
margin-top:-140px;
}

#main{
padding:10px 15px 15px 15px;
}

#clock{
font-size:48px;
margin-bottom:20px;
font-weight:700;
color:#6ec6ff;
transition:color 0.1s linear;
}

.ms{
font-size:30px;
}

.shake{
animation:shake 0.08s infinite;
}

@keyframes shake{
0%{transform:translate(0px,0px);}
25%{transform:translate(1px,-1px);}
50%{transform:translate(-1px,1px);}
75%{transform:translate(1px,1px);}
100%{transform:translate(0px,0px);}
}

input{
padding:12px;
margin:5px;
width:80%;
max-width:320px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
}

button{
margin-top:15px;
padding:14px 35px;
background:#6ec6ff;
border:none;
border-radius:14px;
color:white;
font-size:18px;
font-weight:600;
}

#result{
margin-top:20px;
white-space:pre-line;
font-size:15px;
font-weight:500;
font-family:
"Pretendard",
"Apple SD Gothic Neo",
"Noto Sans KR",
"Helvetica Neue",
sans-serif;
letter-spacing:0.2px;
}
</style>

</head>

<body>

<div id="navy-wrap">
<iframe 
id="navy"
src="https://time.navyism.com/?host=weverse.io">
</iframe>
</div>

<div id="main">

<div id="clock"></div>

<input id="name" placeholder="신청자 이름"><br>
<input id="phone" placeholder="전화번호"><br>

<button onclick="submitForm()">제출!</button>

<div id="result"></div>

</div>

<script>

let records=[];

const messages=[
"아자아자!",
"가보자고",
"가면 가 ♡",
"하면 해 ☆",
"이겨낸다",
"할수있다!",
"화이팅!",
"좀만힘내",
"제발저요...",
"🍀🍀🍀"
];

function updateClock(){
const now=new Date();

const sec=now.getSeconds();
const ms=now.getMilliseconds();

let intensity=0;

if(sec>=50){
intensity=(sec-50)/10+(ms/10000);
}

const baseColor=[110,198,255];

const r=Math.floor(baseColor[0]-(20*intensity));
const g=Math.floor(baseColor[1]-(30*intensity));
const b=Math.floor(baseColor[2]-(20*intensity));

const color="rgb("+r+","+g+","+b+")";

const time=
String(now.getHours()).padStart(2,"0")+":"+
String(now.getMinutes()).padStart(2,"0")+":"+
String(now.getSeconds()).padStart(2,"0");

const milli=
String(ms).padStart(3,"0");

const clock=document.getElementById("clock");

clock.style.color=color;

clock.innerHTML=
time+".<span class='ms'>"+milli+"</span>";

if(sec>=59){
clock.classList.add("shake");
}else{
clock.classList.remove("shake");
}

}

setInterval(updateClock,30);

function submitForm(){

const now=new Date();

const time=
String(now.getHours()).padStart(2,"0")+":"+
String(now.getMinutes()).padStart(2,"0")+":"+
String(now.getSeconds()).padStart(2,"0")+"."+
String(now.getMilliseconds()).padStart(3,"0");

records.unshift(time);

if(records.length>10){
records.pop();
}

document.getElementById("result").innerText=
records.map((t,i)=>`${i+1}. ${t}  ${messages[i] || ""}`).join("\n");

}

</script>

</body>
</html>
