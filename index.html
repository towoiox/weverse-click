<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>위버스 연습</title>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
text-align:center;
}

/* 네이비즘 상하단 강하게 잘라내기 */
#navy-wrap{
height:170px;
overflow:hidden;
}

#navy{
width:100%;
height:600px;
border:none;
margin-top:-140px;
}

#main{
padding:10px 15px 15px 15px;
}

#clock{
font-size:48px;
margin-bottom:20px;
font-weight:700;
color:#6ec6ff;
transition:color 0.1s linear;
}

/* 밀리초 크게 */
.ms{
font-size:30px;
}

/* 진동 효과 */
.shake{
animation:shake 0.08s infinite;
}

@keyframes shake{
0%{transform:translate(0px,0px);}
25%{transform:translate(1px,-1px);}
50%{transform:translate(-1px,1px);}
75%{transform:translate(1px,1px);}
100%{transform:translate(0px,0px);}
}

input{
padding:12px;
margin:5px;
width:80%;
max-width:320px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
}

button{
margin-top:15px;
padding:14px 35px;
background:#6ec6ff;
border:none;
border-radius:14px;
color:white;
font-size:18px;
font-weight:600;
}

#result{
margin-top:20px;
white-space:pre-line;
}
</style>

</head>

<body>

<div id="navy-wrap">
<iframe 
id="navy"
src="https://time.navyism.com/?host=weverse.io">
</iframe>
</div>

<div id="main">

<div id="clock"></div>

<input id="name" placeholder="신청자 이름"><br>
<input id="phone" placeholder="전화번호"><br>

<button onclick="submitForm()">제출!</button>

<div id="result"></div>

</div>

<script>

function updateClock(){
const now=new Date();

const sec=now.getSeconds();
const ms=now.getMilliseconds();

let intensity=0;

// 50초부터 살짝 진해짐
if(sec>=50){
intensity=(sec-50)/10+(ms/10000);
}

// 기본 색
const baseColor=[110,198,255];

// 살짝만 진하게
const r=Math.floor(baseColor[0]-(20*intensity));
const g=Math.floor(baseColor[1]-(30*intensity));
const b=Math.floor(baseColor[2]-(20*intensity));

const color="rgb("+r+","+g+","+b+")";

const time=
String(now.getHours()).padStart(2,"0")+":"+
String(now.getMinutes()).padStart(2,"0")+":"+
String(now.getSeconds()).padStart(2,"0");

const milli=
String(ms).padStart(3,"0");

const clock=document.getElementById("clock");

clock.style.color=color;

clock.innerHTML=
time+".<span class='ms'>"+milli+"</span>";

// 59초 진동
if(sec>=59){
clock.classList.add("shake");
}else{
clock.classList.remove("shake");
}

}

setInterval(updateClock,30);

function submitForm(){

const name=document.getElementById("name").value;
const phone=document.getElementById("phone").value;

const now=new Date();

const time=
String(now.getHours()).padStart(2,"0")+":"+
String(now.getMinutes()).padStart(2,"0")+":"+
String(now.getSeconds()).padStart(2,"0")+"."+
String(now.getMilliseconds()).padStart(3,"0");

document.getElementById("result").innerText=
"이름 : "+name+"\n"+
"전화번호 : "+phone+"\n"+
"제출 시간 : "+time;

}

</script>

</body>
</html>
