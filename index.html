<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>위버스 연습</title>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
text-align:center;
}

#navy{
width:100%;
height:45vh;
border:none;
}

#main{
padding:15px;
}

#clock{
font-size:26px;
margin-bottom:20px;
transition:color 0.2s linear;
}

.ms{
font-size:15px;
}

input{
padding:12px;
margin:5px;
width:80%;
max-width:320px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
}

button{
margin-top:15px;
padding:14px 35px;
background:#2EE6C6;
border:none;
border-radius:14px;
color:white;
font-size:18px;
font-weight:600;
}

#result{
margin-top:20px;
white-space:pre-line;
}
</style>

</head>

<body>

<iframe 
id="navy"
src="https://time.navyism.com/?host=weverse.io"
sandbox="allow-scripts allow-same-origin">
</iframe>

<div id="main">

<div id="clock"></div>

<input id="name" placeholder="신청자 이름"><br>
<input id="phone" placeholder="전화번호"><br>

<button onclick="submitForm()">제출!</button>

<div id="result"></div>

</div>

<script>

function updateClock(){
const now=new Date();

const sec=now.getSeconds();
const ms=now.getMilliseconds();

let intensity=0;

if(sec>=55){
intensity=(sec-55)/5+(ms/5000);
}

const red=Math.min(255,Math.floor(255*intensity));
const color="rgb("+red+",0,0)";

const date=
now.getFullYear()+"-"+
String(now.getMonth()+1).padStart(2,"0")+"-"+
String(now.getDate()).padStart(2,"0");

const time=
String(now.getHours()).padStart(2,"0")+":"+
String(now.getMinutes()).padStart(2,"0")+":"+
String(now.getSeconds()).padStart(2,"0");

const milli=
String(ms).padStart(3,"0");

document.getElementById("clock").style.color=color;

document.getElementById("clock").innerHTML=
date+"<br>"+time+".<span class='ms'>"+milli+"</span>";
}

setInterval(updateClock,50);

function submitForm(){

const name=document.getElementById("name").value;
const phone=document.getElementById("phone").value;

const now=new Date();

const time=
String(now.getHours()).padStart(2,"0")+":"+
String(now.getMinutes()).padStart(2,"0")+":"+
String(now.getSeconds()).padStart(2,"0")+"."+
String(now.getMilliseconds()).padStart(3,"0");

document.getElementById("result").innerText=
"이름 : "+name+"\n"+
"전화번호 : "+phone+"\n"+
"제출 시간 : "+time;

}

</script>

</body>
</html>
